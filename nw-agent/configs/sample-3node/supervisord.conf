; /etc/nw/supervisord.conf — runs etcd + nw-agent as one supervised pair.
;
; Sample form. Production uses systemd units; the deploy tool (orchestrix-style)
; renders both shapes from the same operator+profile YAML.
;
; Source the role-appropriate env files before starting:
;   set -a; source /etc/nw/etcd-<role>.env; source /etc/nw/nw-agent-<role>.env; set +a
;   supervisord -c /etc/nw/supervisord.conf
;
; Where <role> is one of: mysql-master, mysql-slave, app-client.

[supervisord]
nodaemon=true
logfile=/var/log/nw/supervisord.log
pidfile=/var/run/nw/supervisord.pid
user=root

[unix_http_server]
file=/var/run/nw/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/nw/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

; ── etcd (fabric layer) ────────────────────────────────────────────────────
; Inherits the ETCD_* vars from the sourced env file.

[program:fabric]
command=/usr/local/bin/etcd
priority=10
autorestart=true
startsecs=5
stdout_logfile=/var/log/nw/etcd.stdout.log
stderr_logfile=/var/log/nw/etcd.stderr.log
user=nw

; ── nw-agent (the JVM / native binary) ─────────────────────────────────────
; Inherits NW_NODE_NAME, NW_AGENT_*, NW_MYSQL_*, NW_FAILOVER_* from the sourced
; env file. The agent's own logic decides whether a probe arms (presence of
; mysql-client-here facet, etc.).

[program:nw-agent]
command=/usr/bin/java -jar /usr/local/lib/nw-agent/quarkus-run.jar
priority=20
autorestart=true
startsecs=3
stdout_logfile=/var/log/nw/nw-agent.stdout.log
stderr_logfile=/var/log/nw/nw-agent.stderr.log
user=nw

; The failover demo lines ("Fencing master.", "Promoting slave…") are written
; to stdout by FailoverCoordinator; they land in nw-agent.stdout.log.

[group:night-watcher]
programs=fabric,nw-agent
priority=999
