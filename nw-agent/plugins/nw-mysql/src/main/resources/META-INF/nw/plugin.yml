plugin:
  id: nw-mysql
  version: 1.0.0
  service_type: mysql
  cluster_types:
    - MySqlMasterSlave
  description: "MySQL HA monitoring + failover (master + N slaves)"
  author: telcobright
  spi_compatible: ">=1.0,<2.0"

contracts:
  facets_declared:
    - mysql-binary-present
    - mysql-running-here
    - mysql-master-here
    - mysql-slave-here
    - mysql-client-here

  roles_declared:
    - mysql-master
    - mysql-slave
    - mysql-quarantined
    - mysql-promotion-candidate
    - mysql-bootstrap-target
    - mysql-client
    - witness

  actions_declared: []

  investigators_declared:
    # Single active investigator in the current cut.
    - id: mysql.remote.client
      vantage: client
      requires_facets: [mysql-client-here]
      target_from: [nw.mysql.client-target-host, nw.mysql.remote-host]
      query_from: nw.mysql.custom-query        # default "SHOW DATABASES"
      failure_threshold: 3                     # 3 DEAD verdicts → master dead

    # Dormant — source preserved, CDI scope removed. Bring back when the
    # local-self / remote-peer vantages are re-enabled.
    - id: mysql.local.master
      vantage: local-self
      status: dormant
    - id: mysql.local.slave
      vantage: local-self
      status: dormant
    - id: mysql.remote.master
      vantage: remote-peer
      status: dormant
    - id: mysql.remote.slave
      vantage: remote-peer
      status: dormant

permission_matrix_defaults: {}
resolver_policy_defaults: {}
