quarkus:
  application:
    name: nw-agent
  http:
    port: 7102
    host: 0.0.0.0
  log:
    level: INFO
    category:
      "com.tb.nw":
        level: DEBUG

nw:
  agent:
    node-name: ${NW_NODE_NAME:unknown}
    # Multi-peer: comma-separated, e.g.
    #   NW_AGENT_FABRIC_ENDPOINTS=http://10.0.0.1:2379,http://10.0.0.2:2379,http://10.0.0.3:2379
    # The smoke / dev default is a single local peer.
    fabric-endpoints: ${NW_FABRIC_ENDPOINTS:http://127.0.0.1:2379}
