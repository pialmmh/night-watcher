# ============================================================================
#  nw-agent  ·  tenant: link3  ·  profile: dev
# ============================================================================
#
# Placeholder — fill in real values when night-watcher actually deploys to
# link3. The shape is identical to btcl/dev (see that file for full annotation).
# ============================================================================

nw:
  agent:
    node-name: ${NW_NODE_NAME:dev-mustafa}
    cluster-name: link3-dev
    cluster-type: MySqlMasterSlave
    fabric-endpoints:
      - http://127.0.0.1:2379                # TODO: real link3 etcd peers
    static-facets: mysql-client-here
    heartbeat-interval-sec: 5
    heartbeat-ttl-sec: 15

  mysql:
    local-host: 127.0.0.1
    port: 3306
    username: root
    # password via NW_MYSQL_PASSWORD
    client-target-host: 127.0.0.1            # TODO: real link3 MySQL target
    custom-query: SHOW DATABASES
    fast-threshold-ms: 50
    degraded-threshold-ms: 500
    dead-threshold-ms: 5000

  failover:
    failure-threshold: 3
    trigger-investigators:
      - mysql.remote.client
    fence-timeout-sec: 10
    promote-timeout-sec: 10

quarkus:
  http:
    host: ${NW_BIND_HOST:127.0.0.1}
    port: 7102
  log:
    category:
      "com.tb.nw":
        level: DEBUG
