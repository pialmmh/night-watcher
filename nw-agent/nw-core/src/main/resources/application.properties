# ============================================================================
#  nw-agent — multi-tenant entry-point config
# ============================================================================
#
# Layout mirrors routesphere-core's convention:
#
#   src/main/resources/
#   ├── application.properties                     ← THIS FILE
#   └── config/tenants/<tenant>/<profile>/
#                              └── profile-<profile>.yml
#
# This file ONLY:
#   1. Declares the available tenants and their default profile.
#   2. Names the active tenant (which YAML actually loads at startup).
#   3. Sets framework defaults that aren't tenant-specific (HTTP port,
#      log levels, scheduler config).
#
# Every {nw.agent.*, nw.mysql.*, nw.failover.*} key lives in the
# profile YAML, never here.

# ──────────────────────────────────────────────────────────────────────
# Active tenant + profile
# ──────────────────────────────────────────────────────────────────────
#
# At startup the agent loads
#   classpath:config/tenants/${nw.tenant.name}/${nw.tenant.profile}/profile-${nw.tenant.profile}.yml
#
# Override at deploy time with env:
#   NW_TENANT_NAME=bdcom NW_TENANT_PROFILE=prod
nw.tenant.name=btcl
nw.tenant.profile=dev

# Tenant profile YAML is loaded by TenantProfileConfigSource (see nw-core/config/),
# which reads nw.tenant.name + nw.tenant.profile from this file (or env override)
# and registers config/tenants/<name>/<profile>/profile-<profile>.yml as a
# SmallRye config source at startup.
#
# (Quarkus's quarkus.config.locations doesn't accept classpath: URIs at
# build time, hence the custom loader.)

# ──────────────────────────────────────────────────────────────────────
# Tenant inventory
# ──────────────────────────────────────────────────────────────────────
#
# Listed here for operator visibility — only `nw.tenant.name` actually
# selects the active one. Each entry must have a matching
# config/tenants/{name}/{profile}/profile-{profile}.yml on the classpath.
tenants[0].name=btcl
tenants[0].enabled=true
tenants[0].profile=dev

tenants[1].name=bdcom
tenants[1].enabled=false
tenants[1].profile=dev

tenants[2].name=link3
tenants[2].enabled=false
tenants[2].profile=dev

tenants[3].name=example
tenants[3].enabled=false
tenants[3].profile=dev

tenants[4].name=mock
tenants[4].enabled=false
tenants[4].profile=dev

# ──────────────────────────────────────────────────────────────────────
# Framework defaults (not tenant-specific)
# ──────────────────────────────────────────────────────────────────────
quarkus.application.name=nw-agent

# ── Bind policy ─────────────────────────────────────────────────────────
# The status API listens on 127.0.0.1 by default — reachable only from
# the host itself. Production / staging deploys override this to the
# host's overlay (WireGuard) IP via the NW_BIND_HOST env var so the
# dashboard + operators on the overlay can reach /agent/info, but the
# port is NOT exposed on the host's LAN / public interfaces.
#
# If NW_BIND_HOST is unset, the agent falls back to 127.0.0.1 — fail-secure:
# better to be unreachable from peers than to accidentally bind to 0.0.0.0.
#
# When the ActionEndpoint gRPC port (7103) lands it inherits the same policy.
quarkus.http.host=127.0.0.1
quarkus.http.port=7102

quarkus.log.level=INFO
quarkus.log.category."com.tb.nw".level=DEBUG

# Quarkus scheduler is on; the @Scheduled ticks (heartbeat, facet publish,
# investigator, lifecycle) require it.
quarkus.scheduler.enabled=true
